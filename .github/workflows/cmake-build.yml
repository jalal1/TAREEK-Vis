name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Linux and macOS build against the Qt release installed by aqt. Everything
  # the project links (Widgets, OpenGL, OpenGLWidgets, Concurrent, Network)
  # ships inside qtbase.
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Qt6 needs the GL and xkbcommon development headers to configure on
      # Ubuntu; zlib1g-dev satisfies find_package(ZLIB REQUIRED).
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev zlib1g-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          cache: true

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Verify build output
        run: |
          test -x build/TAREEK-Vis
          test -x build/tareek-bench

  # Windows builds under MSYS2 UCRT64, matching release.yml and the toolchain
  # the project is developed with. The MSVC runners carry no zlib, so
  # find_package(ZLIB REQUIRED) cannot be satisfied there without vendoring it.
  windows:
    name: windows-latest (ucrt64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-zlib

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Verify build output
        shell: msys2 {0}
        run: |
          test -f build/TAREEK-Vis.exe
          test -f build/tareek-bench.exe
