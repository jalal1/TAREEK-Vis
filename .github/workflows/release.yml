name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-ninja
            unzip

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Download FFmpeg (essentials build)
        shell: msys2 {0}
        run: |
          set -e
          curl -fL -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          unzip -q ffmpeg.zip -d ffmpeg-extract
          mkdir -p ffmpeg
          # The archive's inner directory carries the ffmpeg version, so the
          # glob shifts on every upstream release. Resolve it explicitly and
          # fail loudly if it no longer matches.
          src=$(find ffmpeg-extract -mindepth 3 -maxdepth 3 -type f -name ffmpeg.exe -path '*/bin/*' | head -1)
          if [ -z "$src" ]; then
            echo "::error::ffmpeg.exe not found in archive - upstream layout changed"
            find ffmpeg-extract -maxdepth 2
            exit 1
          fi
          cp "$src" ffmpeg/ffmpeg.exe
          ./ffmpeg/ffmpeg.exe -version | head -1

      - name: Assemble redistributable folder
        shell: msys2 {0}
        run: |
          set -e
          DIST_DIR=dist/TAREEK-Vis
          mkdir -p "$DIST_DIR"
          cp build/TAREEK-Vis.exe "$DIST_DIR/"
          windeployqt6.exe --release --no-translations "$DIST_DIR/TAREEK-Vis.exe"

          # Resolve remaining UCRT64 runtime deps transitively (ICU, GCC
          # runtime, zlib, etc.) - windeployqt only handles Qt's own DLLs,
          # not their transitive system/runtime dependencies.
          cd "$DIST_DIR"
          changed=1
          while [ "$changed" = 1 ]; do
            changed=0
            for f in $(find . -iname '*.dll' -o -iname 'TAREEK-Vis.exe'); do
              for dep in $(ldd "$f" 2>/dev/null | grep -oi '/ucrt64/[^ ]*\.dll'); do
                base=$(basename "$dep")
                if [ ! -f "./$base" ]; then
                  cp -u "$dep" .
                  changed=1
                fi
              done
            done
          done
          cd -

          mkdir -p "$DIST_DIR/ffmpeg"
          cp ffmpeg/ffmpeg.exe "$DIST_DIR/ffmpeg/"

          # Video recording resolves ffmpeg next to the executable, so a build
          # that ships without it looks fine until a user hits Record.
          if [ ! -f "$DIST_DIR/ffmpeg/ffmpeg.exe" ]; then
            echo "::error::ffmpeg missing from dist - video recording would be broken"
            exit 1
          fi

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set installer version
        shell: bash
        run: |
          sed -i "s/#define MyAppVersion \".*\"/#define MyAppVersion \"${{ steps.version.outputs.version }}\"/" installer/TAREEK-Vis.iss

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\TAREEK-Vis.iss

      - name: Zip portable build
        shell: bash
        run: |
          cd dist
          7z a -tzip "../TAREEK-Vis-${{ steps.version.outputs.version }}-portable.zip" TAREEK-Vis

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/TAREEK-Vis-Setup-${{ steps.version.outputs.version }}.exe
            TAREEK-Vis-${{ steps.version.outputs.version }}-portable.zip
          generate_release_notes: true
